name: 00 - Terraform Infrastructure

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/00-terraform.yml"

jobs:
  terraform:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    env:
      TF_VAR_resource_group_name: "rg-sit722-week08"
      TF_VAR_acr_name: "venurasit722w08acr"
      TF_VAR_storage_account_name: "venurasit722w08storage"
      TF_VAR_aks_cluster_name: "venura-sit722-aks08"
      TF_VAR_aks_dns_prefix: "koalatech08"

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Plan
        run: terraform plan -input=false